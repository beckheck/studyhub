<!doctype html>
<html>
  <head>
    <title>Google OAuth Callback</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .container {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      h1 {
        color: #333;
        margin: 0 0 10px 0;
      }
      p {
        color: #666;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Connecting...</h1>
      <p>Please wait while we complete your Google Calendar authorization.</p>
    </div>

    <script>
      // Get the authorization code from URL
      const urlParams = new URLSearchParams(window.location.search)
      const code = urlParams.get('code')
      const error = urlParams.get('error')

      if (error) {
        document.querySelector('h1').textContent = 'Authorization Failed'
        document.querySelector('p').textContent = `Error: ${error}`
        console.error('OAuth error:', error)
      } else if (code) {
        // Post the code back to the opener window
        if (window.opener) {
          window.opener.postMessage({ type: 'OAUTH_CODE', code: code }, window.location.origin)
          // Close this window after a short delay
          setTimeout(() => window.close(), 1000)
        }
      } else {
        document.querySelector('h1').textContent = 'No Authorization Code'
        document.querySelector('p').textContent = 'No code received from Google.'
      }
    </script>
  </body>
</html>
